spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=com.infinitesoft.pos_relational_data_service.hibernate.JsonbH2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# No persistir logs en BD durante los tests: el DbAppender falla al cierre del
# contexto (pool cerrado) y ensucia la salida con errores que no son fallos reales.
logging.db.level=OFF