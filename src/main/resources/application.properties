spring.application.name=pos-relational-data-service
server.port=8088

# CORS - permite cualquier origen en dev; sobreescribir en prod con orígenes específicos
cors.allowed-origins=*
cors.allow-credentials=false

spring.datasource.url=jdbc:postgresql://localhost:5432/controlneg_rmx_db?currentSchema=public
spring.datasource.username=romax-admin
spring.datasource.password=f4ast3rv3rs10n*
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/test?retryWrites=true&loadBalanced=false&connectTimeoutMS=10000&authSource=admin&authMechanism=SCRAM-SHA-1

# Logging configuration
logging.level.root=INFO
# Set migration import logs to DEBUG to see per-line details
logging.level.com.infinitesoft.pos_relational_data_service.services.impl.MigrationServiceImpl=DEBUG

# Task Scheduling
# Runs at 11:09 PM every day (testing purpose)
#env.task-managers.historial-total-by-date=0 9 23 * * ?
# Runs at 12:00 PM every day
env.task-managers.historial-total-by-date=0 0 12 * * ?
env.formats.date-default=yyyy-MM-dd

# External Auth Service config
auth.service.base-url=http://localhost:8081
auth.service.validate-path=/auth/validate
auth.service.timeout-ms=5000
auth.service.claims-path=/auth/claims
auth.service.user-id-path=/auth/usuario-id

# Async timeout (for Backup generation)
spring.mvc.async.request-timeout=30000

# Mail Microservice Configuration
mail.service.host=http://localhost:8082
mail.service.base-path=/api/v1/mail
mail.service.path.send-file=/send-file

# Expose the health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuraci�n de usuario an�nimo
app.id-usuario-anonimo=1
