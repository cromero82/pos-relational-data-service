spring.application.name=pos-relational-data-service
server.port=8088

# CORS - permite cualquier origen en dev; sobreescribir en prod con orígenes específicos
cors.allowed-origins=*
cors.allow-credentials=false

spring.datasource.url=jdbc:postgresql://localhost:5432/controlneg_rmx_db?currentSchema=public
spring.datasource.username=romax-admin
spring.datasource.password=f4ast3rv3rs10n*
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/test?retryWrites=true&loadBalanced=false&connectTimeoutMS=10000&authSource=admin&authMechanism=SCRAM-SHA-1

# Logging configuration
logging.level.root=INFO
# Set migration import logs to DEBUG to see per-line details
logging.level.com.infinitesoft.pos_relational_data_service.services.impl.MigrationServiceImpl=DEBUG
# Nivel mínimo para persistir logs en InfluxDB (TRACE, DEBUG, INFO, WARN, ERROR)
logging.db.level=INFO

# === Monitoreo: InfluxDB 3 Core (logs-infinito) ===
# URL base del servidor InfluxDB 3
monitor.influx.url=http://127.0.0.1:8181
# Database (bucket) donde se escribe; se crea al startup si no existe
monitor.influx.database=infinito_logs
# Retención (90 días). Solo se aplica al crear la database por primera vez.
monitor.influx.retention=90d
# Tamaño de batch (líneas por POST a Influx). Mayor = más throughput, menos llamadas
monitor.influx.batch-size=100
# Cada cuántos ms el worker hace flush aunque el batch esté incompleto
monitor.influx.flush-interval-ms=2000
# Cola en memoria (eventos máximos antes de derramar a disco)
monitor.influx.queue-capacity=10000
# Carpeta donde se guardan los archivos .lp si Influx está caído
monitor.influx.spool-dir=./monitor-spool
# Cada cuántos ms el reintento procesa los archivos en spool
monitor.influx.retry-interval-ms=30000
# Timeout HTTP por cada llamada a Influx (write/health)
monitor.influx.http-timeout-ms=5000
# Auth: dejar vacío en modo --without-auth; si no, "Token <admin-token>"
monitor.influx.auth-header=

# Task Scheduling
# Runs at 11:09 PM every day (testing purpose)
#env.task-managers.historial-total-by-date=0 9 23 * * ?
# Runs at 12:00 PM every day
env.task-managers.historial-total-by-date=0 0 12 * * ?
env.formats.date-default=yyyy-MM-dd

# External Auth Service config
auth.service.base-url=http://localhost:8081
auth.service.validate-path=/auth/validate
auth.service.timeout-ms=5000
auth.service.claims-path=/auth/claims
auth.service.user-id-path=/auth/usuario-id

# Async timeout (for Backup generation)
spring.mvc.async.request-timeout=30000

# Mail Microservice Configuration
mail.service.host=http://localhost:8082
mail.service.base-path=/api/v1/mail
mail.service.path.send-file=/send-file

# Expose the health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuraci�n de usuario an�nimo
app.id-usuario-anonimo=1
